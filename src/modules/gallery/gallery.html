<!-- Modul: Galerie & Fotodokumentace -->
<section id="gallery-section">
    <div class="section-title">
        <h2>Galerie projektu</h2>
        <p>Prohlédněte si vizualizace a detaily provedení.</p>
    </div>
    
    <div class="gallery-wrapper" style="position: relative;">
        <button id="gallery-prev" class="gallery-nav-btn" style="display: none;" aria-label="Předchozí foto">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button id="gallery-next" class="gallery-nav-btn" style="display: none;" aria-label="Další foto">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <div class="gallery-grid" id="gallery-container">
            <!-- Dynamicky plněno modulem gallery -->
        </div>
    </div>
</section>

<!-- Lightbox Modal -->
<div id="lightbox-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;">
    <span id="lightbox-close" style="position: absolute; top: 20px; right: 40px; color: white; font-size: 50px; cursor: pointer; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">&times;</span>
    <img id="lightbox-img" src="" alt="Detail fotografie" style="max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
</div>

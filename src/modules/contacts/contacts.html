<!-- Modul: Kontakty & Partneři -->
<section id="contact" style="background: var(--gray-100);">
    <div class="section-title">
        <h2 id="editable-contact-title">Máte dotaz?</h2>
        <p id="editable-contact-text">Náš tým je vám k dispozici pro prohlídku nebo konzultaci.</p>
    </div>
    
    <div class="contact-container">
        <!-- Partneři projektu -->
        <div class="partners-section">
            <h3 style="margin-bottom: 1.5rem; text-align: center;">Partneři projektu</h3>
            <div id="partners-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1.5rem; align-items: center;">
                <!-- Dynamicky generováno modulem contacts -->
            </div>
        </div>

        <!-- Vizitka Makléře -->
        <div class="agent-card">
            <div class="agent-photo">
                <img id="agent-photo-display" src="" alt="Makléř" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                <svg id="agent-photo-placeholder" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <h4 id="editable-agent-name" class="agent-name">Jan Novák</h4>
            <span class="agent-role">Váš průvodce nákupem</span>
            
            <div class="agent-contact-list">
                <a class="agent-info-row" id="editable-contact-phone-link" href="tel:+420123456789">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    <span id="editable-contact-phone">+420 123 456 789</span>
                </a>
                <a class="agent-info-row" id="editable-contact-email-link" href="mailto:info@modernibydleni.cz">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <span id="editable-contact-email">info@modernibydleni.cz</span>
                </a>
            </div>

            <div class="social-links-row" style="margin-top: 1rem; display: flex; gap: 10px;">
                <a href="#" id="fb-link" target="_blank" class="social-btn" aria-label="Facebook" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                </a>
                <a href="#" id="ig-link" target="_blank" class="social-btn" aria-label="Instagram" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
            </div>
            
            <a href="mailto:info@modernibydleni.cz" class="btn agent-cta-btn" id="editable-contact-btn" style="margin-top: 1.5rem; width: 100%;">Nezávazná poptávka</a>
        </div>
    </div>
</section>

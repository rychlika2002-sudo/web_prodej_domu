<!-- Modul: Dispoziční řešení a Tabulka místností -->
<div class="engineering-card-module" id="dispo-module">
    <div class="module-card-header">
        <div class="module-title-box">
            <span class="module-icon">📐</span>
            <div>
                <h3>Dispoziční řešení a Tabulka místností</h3>
                <p>Interaktivní správa místností, užitných ploch a podlahových krytin</p>
            </div>
        </div>
    </div>

    <div class="module-card-body" style="padding: 1rem 0;">
        <div class="table-responsive" style="overflow-x: auto;">
            <table class="spec-table" id="dispo-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f1f5f9; border-bottom: 2px solid #cbd5e1; text-align: left;">
                        <th style="padding: 10px;">Číslo</th>
                        <th style="padding: 10px;">Název místnosti</th>
                        <th style="padding: 10px;">Podlaží</th>
                        <th style="padding: 10px;">Plocha (m²)</th>
                        <th style="padding: 10px;">Podlaha</th>
                        <th style="padding: 10px; text-align: center;">Akce</th>
                    </tr>
                </thead>
                <tbody id="dispo-tbody">
                    <!-- Dynamicky generováno modulem dispo -->
                </tbody>
                <tfoot>
                    <tr style="font-weight: bold; background: #f8fafc; border-top: 2px solid #cbd5e1;">
                        <td colspan="3" style="padding: 12px 10px; text-align: right;">Celková užitná plocha:</td>
                        <td id="dispo-total-area" style="padding: 12px 10px; color: #2563eb; font-size: 1.1rem;">124.5 m²</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div style="margin-top: 1rem; display: flex; gap: 10px; justify-content: flex-end;">
            <button id="dispo-add-row" class="btn" style="background: #10b981;">+ Přidat místnost</button>
            <button id="dispo-export-csv" class="btn" style="background: #64748b;">📥 Export do CSV</button>
        </div>
    </div>
</div>

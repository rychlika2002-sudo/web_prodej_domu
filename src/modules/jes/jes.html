<!-- Modul: JES & Odnětí ZPF -->
<div class="engineering-card-module" id="jes-module">
    <div class="module-card-header">
        <div class="module-title-box">
            <span class="module-icon">🌱</span>
            <div>
                <h3>Jednotné Environmentální Stanovisko (JES) & Odnětí ZPF</h3>
                <p>Kalkulačka odvodů za odnětí půdy ze ZPF dle BPEJ a legislativy 2026</p>
            </div>
        </div>
    </div>

    <div class="module-card-body grid-2col">
        <div class="calc-panel">
            <div class="input-row">
                <label>Kód BPEJ (bonitní půdní ekologická jednotka):</label>
                <input type="text" id="jes-bpej" class="form-input" placeholder="např. 5.14.00" value="5.14.00">
            </div>
            <div class="input-row">
                <label>Třída ochrany půdy (I. - V.):</label>
                <select id="jes-trida" class="form-select">
                    <option value="1">I. třída ochrany (koeficient 9.0)</option>
                    <option value="2">II. třída ochrany (koeficient 6.0)</option>
                    <option value="3" selected>III. třída ochrany (koeficient 4.0)</option>
                    <option value="4">IV. třída ochrany (koeficient 3.0)</option>
                    <option value="5">V. třída ochrany (koeficient 1.0)</option>
                </select>
            </div>
            <div class="input-row">
                <label>Výměra odnímané plochy (m²):</label>
                <input type="number" id="jes-area" class="form-input" value="350" min="1">
            </div>
            <div class="input-row">
                <label>Základní sazba půdy (Kč/m²):</label>
                <input type="number" id="jes-base-rate" class="form-input" value="15.50" step="0.5">
            </div>
            <button id="jes-calc-btn" class="btn" style="width: 100%; margin-top: 10px;">Spočítat odvody ZPF</button>
        </div>

        <div class="result-panel" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.25rem;">
            <h4 style="margin-bottom: 1rem; color: #2d3748;">📊 Výsledný odvod ZPF:</h4>
            <div class="stat-box" style="margin-bottom: 1rem;">
                <span style="font-size: 0.85rem; color: #64748b;">Celková částka odvodu:</span>
                <div id="jes-result-total" style="font-size: 1.8rem; font-weight: 700; color: #16a34a;">21 700 Kč</div>
            </div>
            <div style="font-size: 0.85rem; color: #475569; line-height: 1.6;" id="jes-result-breakdown">
                Výpočet: 350 m² × 15.50 Kč/m² × koef. 4.0 = 21 700 Kč
            </div>
            <div class="badge-tag" style="margin-top: 1rem; display: inline-block; padding: 4px 10px; background: #ecfdf5; color: #065f46; border-radius: 20px; font-size: 0.75rem;">
                ✓ V souladu se zákonem o ochraně ZPF
            </div>
        </div>
    </div>
</div>
